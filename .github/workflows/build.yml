name: Build Addon ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: tag_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version from tag: $VERSION"
    
    - name: Set version from input
      if: github.event_name == 'workflow_dispatch'
      id: input_version
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        echo "Version from input: ${{ github.event.inputs.version }}"
    
    - name: Get addon ID
      id: addon_id
      run: |
        ADDON_ID=$(grep 'id="' addon.xml | sed 's/.*id="\([^"]*\)".*/\1/' | head -1)
        echo "addon_id=$ADDON_ID" >> $GITHUB_OUTPUT
        echo "Addon ID: $ADDON_ID"
    
    - name: Get version from addon.xml
      id: addon_version
      run: |
        VERSION=$(grep 'version="' addon.xml | sed 's/.*version="\([^"]*\)".*/\1/' | head -1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version from addon.xml: $VERSION"
    
    - name: Determine final version
      id: final_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [ -n "${{ steps.tag_version.outputs.version }}" ]; then
          VERSION="${{ steps.tag_version.outputs.version }}"
        else
          VERSION="${{ steps.addon_version.outputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION"
    
    - name: Create ZIP file
      id: create_zip
      run: |
        ADDON_ID="${{ steps.addon_id.outputs.addon_id }}"
        VERSION="${{ steps.final_version.outputs.version }}"
        ZIP_NAME="${ADDON_ID}-${VERSION}.zip"
        BUILD_DIR="build"
        ADDON_DIR="${BUILD_DIR}/${ADDON_ID}"
        
        # Create build directory structure
        mkdir -p "${ADDON_DIR}"
        
        # Copy addon files (excluding git files, build artifacts, and development files)
        cp addon.xml "${ADDON_DIR}/"
        cp service.py "${ADDON_DIR}/"
        cp LICENSE "${ADDON_DIR}/"
        cp -r resources "${ADDON_DIR}/"
        if [ -f README.md ]; then
          cp README.md "${ADDON_DIR}/"
        fi
        
        # Create ZIP from build directory
        cd "${BUILD_DIR}"
        zip -r "../${ZIP_NAME}" "${ADDON_ID}"
        cd ..
        
        # Clean build directory
        rm -rf "${BUILD_DIR}"
        
        echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
        echo "Created: $ZIP_NAME"
        ls -lh "$ZIP_NAME"
    
    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: addon-zip
        path: ${{ steps.create_zip.outputs.zip_name }}
        retention-days: 30
    
    - name: Upload release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.create_zip.outputs.zip_name }}

